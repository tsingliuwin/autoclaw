  <div tw="w-36 h-36 rounded-3xl bg-linear-to-br from-blue-500 to-indigo-600 flex items-center justify-center" style="animation:breathe 1.2s ease-in-out infinite">

  </div>
  <div style="position:absolute;margin-top:220px;width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-bottom:30px solid #f59e0b;animation:spin 2s linear infinite"></div>
